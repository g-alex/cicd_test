stages:              # фазы пайплайна по порядку
  - test

my-job:
  stage: test                 # к какой фазе относится
  image: python:3.14          # docker-образ, в котором выполняется
  script:                     #  команды по порядку (как steps в GH)
    - pip install -r requirements.txt
    - playwright install --with-deps chromium
    - pytest